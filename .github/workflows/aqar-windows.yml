name: Build Windows distribution
on:
  workflow_dispatch:
  push:
    branches: ['aqar/windows-release']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build and test source and frozen application
        shell: pwsh
        run: ./AqarManagerPro/build_windows.ps1
      - name: Upload installer, portable distribution and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: AqarManagerPro-Windows-x64
          path: AqarManagerPro/release/*
          if-no-files-found: error
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics
          path: 'AqarManagerPro/*test.json'
